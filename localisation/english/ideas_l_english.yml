 YCP_won_rigged_elections: "The Young China Party consolidated power in the 1940 elections"

 QIE_chinas_gravest_hour: "China's Gravest Hour"
 QIE_chinas_gravest_hour_desc: "Flags are fluttering, sword is drawn, and gun on our shoulders. That which we have come to fear, has finally come at last and now our centuries' old civilisation risks total cultural and racial annihilation at the hands of the Japanese imperialists. It is time to put petty warlord squabbles away from us, for us to bury the hatchet, and for us, the Chinese people to unite once more in the face of this adversity!"

 QIE_the_chinese_hindenburg_line: "The Chinese Hindenburg Line"
 QIE_the_chinese_hindenburg_line_desc: "China's vast land expanse means that the enemy will most likely attempt a naval invasion of our country rather than a direct land invasion. Given the economic and political importance of the coastal regions, we would do well to prepare in advance of the enemy's invasion by fortifying and preparing the coastline with bunkers, pillboxes, and other defences - creating our very own Hindenburg line."

 QIE_wartime_industry_relocation: "Wartime Industry Relocation"
 QIE_wartime_industry_relocation_desc: "With much of China's domestic and military industries located along the coastal regions of the country, they will no doubt come under pressure and attack from the enemy. In order to preserve our industrial capabilities, we will seek to move not just industries, but also heavy machinery and civilians into the country's interior so we can fight on and exhaust the enemy's advance."

 QIE_heroic_revolutionary_fighters: "Heroic Revolutionary Fighters"
 QIE_heroic_revolutionary_fighters_desc: "Our soldiers are like no others. In the face of complete annihilation at the face of the foreign intruders, they continue to display relentless bravery and patriotism. With guns in hand, ferocity in their hearts, and an undying will, may we exalt our brave revolutionary fighters, as they continue to fight both in life and death. Forwards!"

 QIE_one_thousands_sons_one_thousand_soldiers: "One Thousand Sons, One Thousand Soldiers"
 QIE_one_thousands_sons_one_thousand_soldiers_desc: "It is true that an army feeds on its stomach. As the enemy marches across our beloved great country, his supplies lines grow increasingly thin and he will grow emboldened as we seem to fall back towards the interior. In times of crisis, all must be expected to give up whatever they may have in order to achieve the final victory. We will seek to utilise anything of use we may find in the countryside, before attacking our exhausted enemies through the means of guerrilla warfare."

 QIE_prepare_guerrila_cells: "Prepare Guerrilla Cells"
 QIE_prepare_guerrila_cells_desc: "Even if we cannot match the enemy in the sea, in the air, or in conventional combat; there are ways that a people can fight. From every town, village, and farm; we will encourage all who are willing to fight for their country's salvation to create resistance groups. They will lay in wait behind enemy lines; in order to wreck havoc and destruction among the enemies' morale, supply, and logistical capabilities."

 QIE_blockade_runners: "Blockade Runners"
 QIE_blockade_runners_desc: "Incapable of posing anything more than a papercut to the foreign invader's navies, we lament that we cannot extend our protection beyond our immediate coastline. Outside of our harbours, our rivers, and our airfields, the enemy is perfectly capable of cutting off major foreign shipments using their navy. It is imperative that we develop strategies and ships capable of evading enemy patrols and circumventing the blockade."

