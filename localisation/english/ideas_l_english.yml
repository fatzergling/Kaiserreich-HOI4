 PAR_BOL_reparations_PAR: "War Reparations from Bolivia"
 PAR_BOL_reparations_BOL: "War Reparations to Paraguay"

 FNG_bribe_lobbyists: "Bribe Pro-Japanese Lobbyists"
 FNG_bribe_lobbyists_desc: "Ostensibly the only thing the so-called Concordia Association cares about is money. Money, Money, Money. However with our extensive connections in business and banking, perhaps we can cash out a little bit, entertain the more malleable pro-Japanese lobbyists with gifts. With this, we can force them to stay silent for a few months, decreasing the influence Japan has on our policymaking."

 FNG_encourage_domestic_production: "Encourage Domestic Production"
 FNG_encourage_domestic_production_desc: "Ultimately their undoing, our relationship with Japan has led to a rapid development of China's own domestic production capabilities. Rows of factories are erected annually, developing our economy and industry far greater than we could ever hope for. Utilising such strengths, we can grant preferential treatment to native corporations and industry, granting them lucrative contracts in lieu of Japanese competitors. Impacting our overall industrial efficiency, it will cripple the Japanese for a period of time."

 FNG_entice_financial_support: "Entice Japanese Financial Support"
 FNG_entice_financial_support_desc: "What are the Jaoanese here for if not to provide us with funding, just in exchange for selling our spirit a little? By utilising contacts within the Concordia Association and the Kwantung Army, we can easily attain more funding to help equalise our financial balance. Regretfully, this will enable the Japanese to further dig their claws into our political scene, tying our politicians to Japanese money."


 MIT_economic_upheaval: "Economic Upheaval"
 MIT_economic_upheaval_desc: "Our decision to leave Mitteleuropa has had predictably startling effects on our economy. Our relations with them, and the rest of the world, are now all thrown into question."


 general_deploy_troops_to_occupation_zones_desc: "Our occupation governments require additional troops to suppress rebel holdouts and pacify the people. Let us send another reserve division to bolster the occupation effort!"
 ARG_Foreign_owned_factories: "Foreign-Owned Factories"
